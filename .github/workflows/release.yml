name: release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: python -m compileall skills
      - run: python skills/oi-workbench/generator/build_all_reference.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install --no-package-lock --legacy-peer-deps
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1
      - name: Publish npm package
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 优先使用 NPM_TOKEN secret；没有时才回退 OIDC trusted publishing。
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            PROVENANCE=""
          else
            # 确保空 token 环境变量不干扰 OIDC
            unset NPM_TOKEN NODE_AUTH_TOKEN 2>/dev/null || true
            rm -f .npmrc "$HOME/.npmrc" "$RUNNER_TEMP/.npmrc" 2>/dev/null || true
            PROVENANCE="--provenance"
          fi
          npm config get registry
          if [ "${{ github.ref_name }}" = "dev" ]; then
            BASE_VERSION=$(node -p "require('./package.json').version")
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            npm version "${BASE_VERSION}-beta.${TIMESTAMP}" --no-git-tag-version
            npm publish --tag beta $PROVENANCE --access public || { echo '=== npm publish failed ==='; LOG=$(ls -t "$HOME/.npm/_logs"/*.log 2>/dev/null | head -1); echo "npm debug log: $LOG"; if [ -n "$LOG" ]; then cat "$LOG"; fi; exit 1; }
          else
            npm publish $PROVENANCE --access public || { echo '=== npm publish failed ==='; LOG=$(ls -t "$HOME/.npm/_logs"/*.log 2>/dev/null | head -1); echo "npm debug log: $LOG"; if [ -n "$LOG" ]; then cat "$LOG"; fi; exit 1; }
          fi

  release:
    needs: publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
