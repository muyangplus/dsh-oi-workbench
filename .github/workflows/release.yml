name: release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y g++
      - run: python -m compileall skills
      - run: python skills/oi-workbench/generator/build_all_reference.py

  publish:
    needs: test
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install --no-package-lock --legacy-peer-deps
      - name: Publish npm package
        shell: bash
        run: |
          # 只用 OIDC 可信发布：清掉 setup-node 可能注入的 token 文件，避免旧 NODE_AUTH_TOKEN 盖住 OIDC
          rm -f .npmrc "$HOME/.npmrc" "$RUNNER_TEMP/.npmrc" 2>/dev/null || true
          npm config get registry
          if [ "${{ github.ref_name }}" = "dev" ]; then
            npm version prerelease --preid=beta --no-git-tag-version
            npm publish --tag beta --provenance --access public || { echo '=== npm debug log tail ==='; tail -n 200 "$HOME/.npm/_logs/$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)"; exit 1; }
          else
            npm publish --provenance --access public || { echo '=== npm debug log tail ==='; tail -n 200 "$HOME/.npm/_logs/$(ls -t "$HOME/.npm/_logs" 2>/dev/null | head -1)"; exit 1; }
          fi

  release:
    needs: publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
